<p-card class="quick-add-card rounded-2xl overflow-hidden border-0 shadow-xl bg-white dark:bg-gray-800 border-t-4 border-t-indigo-500">
  <!-- Header with icon and title -->
  <ng-template pTemplate="header">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 p-4 sm:p-5 bg-gradient-to-r from-indigo-50 to-white dark:from-indigo-950/30 dark:to-gray-800">
      <div class="flex items-center gap-3">
        <div class="flex-shrink-0 w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center shadow-sm">
          <i class="pi pi-plus-circle text-xl sm:text-2xl text-indigo-600 dark:text-indigo-400"></i>
        </div>
        <div>
          <h3 class="text-base sm:text-lg font-bold text-gray-800 dark:text-gray-100">Quick Add Item</h3>
          <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">Add a line item to an existing invoice</p>
        </div>
      </div>
      <!-- Amount preview - visible on larger screens -->
      <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-100/80 dark:bg-indigo-900/40">
        <i class="pi pi-wallet text-indigo-600 dark:text-indigo-400"></i>
        <span class="text-sm font-medium text-gray-600 dark:text-gray-300">Amount:</span>
        <span class="text-lg font-bold text-indigo-700 dark:text-indigo-300">₹{{ getAmount() | number:'1.2-2' }}</span>
      </div>
    </div>
  </ng-template>

  <div class="p-4 sm:p-5 space-y-5 sm:space-y-6">
    <!-- Row 1: Invoice + Particulars + Vehicle number -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-5">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-file text-indigo-500 text-sm"></i>
          Select Invoice
        </label>
        <p-select
          [options]="invoices$ | async"
          optionLabel="invoiceNumber"
          optionValue="id"
          placeholder="Choose an invoice"
          [showClear]="true"
          (onChange)="setInvoice($event.value)"
          styleClass="w-full quick-add-select"
          inputStyleClass="w-full rounded-lg">
        </p-select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-align-left text-indigo-500 text-sm"></i>
          Particulars
        </label>
        <input
          pInputText
          [(ngModel)]="item.particulars"
          placeholder="Item description or service name"
          class="w-full rounded-lg quick-add-input"/>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-car text-indigo-500 text-sm"></i>
          Vehicle number
        </label>
        <input
          pInputText
          [(ngModel)]="item.vehicleNo"
          placeholder="e.g. MH12 AB 1234"
          class="w-full rounded-lg quick-add-input"
          autocomplete="off" />
      </div>
    </div>

    <!-- Row 2: Date, Quantity, Rate -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-5">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-calendar text-indigo-500 text-sm"></i>
          Date
        </label>
        <p-datepicker
          [(ngModel)]="item.date"
          dateFormat="dd/mm/yy"
          appendTo="body"
          styleClass="w-full rounded-lg"
          inputStyleClass="w-full rounded-lg"
          [showIcon]="true"
          placeholder="Select date">
        </p-datepicker>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-hashtag text-indigo-500 text-sm"></i>
          Quantity
        </label>
        <p-inputNumber
          [(ngModel)]="item.quantity"
          [min]="1"
          [max]="99999"
          styleClass="w-full rounded-lg"
          inputStyleClass="w-full rounded-lg"
          placeholder="1">
        </p-inputNumber>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-200 flex items-center gap-2">
          <i class="pi pi-indian-rupee text-indigo-500 text-sm"></i>
          Rate (₹)
        </label>
        <p-inputNumber
          [(ngModel)]="item.rate"
          [min]="0"
          [maxFractionDigits]="2"
          styleClass="w-full rounded-lg"
          inputStyleClass="w-full rounded-lg"
          placeholder="0.00">
        </p-inputNumber>
      </div>
    </div>

    <!-- Amount on mobile + Actions -->
    <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-4 pt-2 border-t border-gray-200 dark:border-gray-600">
      <div class="flex flex-wrap gap-2 sm:gap-3">
        <p-button
          icon="pi pi-check"
          label="Add Item"
          severity="success"
          [loading]="isLoading"
          (click)="addItem()"
          class="!text-sm sm:!text-base">
        </p-button>
        <p-button
          icon="pi pi-refresh"
          label="Clear"
          severity="secondary"
          [outlined]="true"
          (click)="clearForm()"
          class="!text-sm sm:!text-base">
        </p-button>
        <p-button
          icon="pi pi-arrow-right"
          label="Go to Invoice"
          severity="info"
          [outlined]="true"
          (click)="navigateToInvoice()"
          class="!text-sm sm:!text-base">
        </p-button>
      </div>
      <!-- Amount chip - visible on mobile only (above buttons due to flex-col-reverse) -->
      <div class="sm:hidden flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 w-fit">
        <i class="pi pi-wallet text-indigo-600 dark:text-indigo-400"></i>
        <span class="text-sm font-bold text-indigo-700 dark:text-indigo-300">₹{{ getAmount() | number:'1.2-2' }}</span>
      </div>
    </div>
  </div>
</p-card>
