<header class="app-header fixed top-0 left-0 right-0 z-50">
  <div class="header-container">
    <p-menubar
      [model]="items"
      styleClass="app-menubar"
      [autoDisplay]="false"
      breakpoint="992">
      <!-- Logo only -->
      <ng-template pTemplate="start">
        <a routerLink="/dashboard" class="header-logo flex items-center shrink-0" aria-label="Home">
          <img
            src="assets/images/logos/payinvoflow-logo.png"
            alt="Logo"
            class="header-logo-img"
          />
        </a>
      </ng-template>

      <!-- Right: theme + login -->
      <ng-template pTemplate="end">
        <div class="header-actions flex items-center gap-2 sm:gap-4">
          <theme-switcher class="shrink-0 rounded-full transition-transform hover:scale-105"></theme-switcher>
          <button
            pButton
            type="button"
            icon="pi pi-user"
            label="Login"
            class="p-button-rounded p-button-outlined p-button-sm !text-xs sm:!text-sm header-login"
          ></button>
        </div>
      </ng-template>
    </p-menubar>
  </div>
</header>
